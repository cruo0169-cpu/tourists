<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的投诉 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>我的投诉</h1>
    <p>跟踪投诉处理进度，查看处理结果并进行评价</p>
    <a class="btn" th:href="@{/complaint/new}">+ 提交投诉</a>
  </div>

  <div class="card" th:if="${!#lists.isEmpty(complaints)}">
    <table class="table">
      <thead>
        <tr>
          <th>标题</th>
          <th>提交时间</th>
          <th>状态</th>
          <th>处理人员</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${complaints}">
          <td>
            <a th:href="@{'/complaint/' + ${c.id}}" th:text="${c.title}">标题</a>
          </td>
          <td class="muted" th:text="${#temporals.format(c.createdAt,'yyyy-MM-dd HH:mm')}">时间</td>
          <td th:replace="~{fragments/badges :: complaintStatus(${c})}"></td>
          <td class="muted" th:text="${c.handler != null ? (c.handler.name ?: c.handler.username) : '未分派'}">处理人员</td>
          <td><a class="btn ghost sm" th:href="@{'/complaint/' + ${c.id}}">查看</a></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(complaints)}">
    暂无投诉记录，点击右上角“提交投诉”开始。
  </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
