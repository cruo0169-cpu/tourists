<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提交投诉 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>提交投诉</h1>
    <p>描述您遇到的问题，可上传照片或视频附件</p>
  </div>

  <div class="card card-pad" style="max-width:760px;">
    <form th:action="@{/complaint/new}" method="post" enctype="multipart/form-data">
      <div class="field">
        <label class="label">投诉标题 *</label>
        <input type="text" name="title" required placeholder="简要描述投诉主题">
      </div>
      <div class="field">
        <label class="label">投诉内容 *</label>
        <textarea name="content" required placeholder="请详细描述投诉内容、时间、地点等情况"></textarea>
      </div>
      <div class="form-row">
        <div class="field">
          <label class="label">现场照片</label>
          <input type="file" name="image" accept="image/*">
        </div>
        <div class="field">
          <label class="label">视频附件</label>
          <input type="file" name="video" accept="video/*">
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">提交投诉</button>
        <a class="btn ghost" th:href="@{/complaint/mine}">返回我的投诉</a>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
