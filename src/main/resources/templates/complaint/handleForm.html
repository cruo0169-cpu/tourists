<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投诉处理 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>投诉处理</h1>
    <p th:text="${c.title}">标题</p>
  </div>

  <div class="card card-pad" style="max-width:760px;">
    <div class="alert info" style="font-size:14px;">
      <strong>投诉内容：</strong><span th:text="${c.content}" style="white-space:pre-wrap;"></span>
    </div>

    <form th:action="@{'/complaint/' + ${c.id} + '/handle'}" method="post" enctype="multipart/form-data">
      <div class="field">
        <label class="label">处理意见 *</label>
        <textarea name="handleOpinion" required placeholder="现场核查与处理经过"></textarea>
      </div>
      <div class="field">
        <label class="label">处理结果 *</label>
        <textarea name="handleResult" required placeholder="最终处理结果"></textarea>
      </div>
      <div class="form-row">
        <div class="field">
          <label class="label">处理照片</label>
          <input type="file" name="image" accept="image/*">
        </div>
        <div class="field">
          <label class="label">视频附件</label>
          <input type="file" name="video" accept="video/*">
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">提交处理结果</button>
        <a class="btn ghost" th:href="@{'/complaint/' + ${c.id}}">查看详情</a>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
