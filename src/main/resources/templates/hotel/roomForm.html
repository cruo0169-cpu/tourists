<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增房型 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1 th:text="${hotel.name} + ' · 新增房型'">新增房型</h1>
    <p>录入房间类型与实时预订信息</p>
  </div>

  <div class="card card-pad" style="max-width:640px;">
    <form th:action="@{'/hotel/' + ${hotel.id} + '/room/new'}" method="post">
      <div class="field">
        <label class="label">房型名称 *</label>
        <input type="text" name="roomType" required placeholder="如：标准双床房">
      </div>
      <div class="form-row">
        <div class="field">
          <label class="label">价格（元） *</label>
          <input type="number" name="price" step="0.01" required placeholder="0.00">
        </div>
        <div class="field">
          <label class="label">总房间数 *</label>
          <input type="number" name="totalRooms" min="0" required placeholder="0">
        </div>
      </div>
      <div class="field">
        <label class="label">剩余可订数 *</label>
        <input type="number" name="availableRooms" min="0" required placeholder="0">
      </div>
      <div class="actions">
        <button class="btn" type="submit">保存</button>
        <a class="btn ghost" th:href="@{'/hotel/' + ${hotel.id} + '/rooms'}">返回</a>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
