<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h2>登录</h2>
    <div class="sub">请输入用户名和密码</div>

    <div class="alert error" th:if="${param.error}">用户名或密码错误。</div>
    <div class="alert ok" th:if="${param.logout}">您已退出登录。</div>
    <div class="alert ok" th:if="${ok}" th:text="${ok}"></div>

    <form th:action="@{/login}" method="post">
      <div class="field">
        <label class="label">用户名</label>
        <input type="text" name="username" placeholder="用户名" required autofocus>
      </div>
      <div class="field">
        <label class="label">密码</label>
        <input type="password" name="password" placeholder="密码" required>
      </div>
      <div class="actions" style="margin-top:20px;">
        <button class="btn" type="submit" style="width:100%;justify-content:center;">登录</button>
      </div>
    </form>
    <div class="link-row" style="justify-content:center;">
      <span style="margin-right:6px;">没有账号？</span>
      <a th:href="@{/register}">注册</a>
    </div>
  </div>
</div>
</body>
</html>
