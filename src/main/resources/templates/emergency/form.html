<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${info.id != null ? '编辑应急信息' : '发布应急信息'}">发布应急信息</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1 th:text="${info.id != null ? '编辑应急信息' : '发布应急信息'}">标题</h1>
    <p>发布后需经审批人员审批通过方可展示</p>
  </div>

  <div class="card card-pad" style="max-width:760px;">
    <form th:if="${info.id == null}" th:action="@{/emergency/new}" method="post">
      <div class="field">
        <label class="label">信息标题 *</label>
        <input type="text" name="title" required placeholder="应急信息标题">
      </div>
      <div class="field">
        <label class="label">信息分类</label>
        <input type="text" name="category" placeholder="如：交通提示 / 安全提示">
      </div>
      <div class="field">
        <label class="label">信息内容 *</label>
        <textarea name="content" required placeholder="应急信息详细内容"></textarea>
      </div>
      <div class="form-row">
        <div class="field">
          <label class="label">有效期开始</label>
          <input type="date" name="validFrom">
        </div>
        <div class="field">
          <label class="label">有效期结束</label>
          <input type="date" name="validTo">
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">提交发布</button>
        <a class="btn ghost" th:href="@{/emergency/manage}">返回管理</a>
      </div>
    </form>

    <form th:if="${info.id != null}" th:action="@{'/emergency/' + ${info.id} + '/edit'}" method="post">
      <div class="field">
        <label class="label">信息标题 *</label>
        <input type="text" name="title" th:value="${info.title}" required>
      </div>
      <div class="field">
        <label class="label">信息分类</label>
        <input type="text" name="category" th:value="${info.category}">
      </div>
      <div class="field">
        <label class="label">信息内容 *</label>
        <textarea name="content" required th:text="${info.content}"></textarea>
      </div>
      <div class="form-row">
        <div class="field">
          <label class="label">有效期开始</label>
          <input type="date" name="validFrom" th:value="${info.validFrom}">
        </div>
        <div class="field">
          <label class="label">有效期结束</label>
          <input type="date" name="validTo" th:value="${info.validTo}">
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">保存修改</button>
        <a class="btn ghost" th:href="@{/emergency/manage}">返回管理</a>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
