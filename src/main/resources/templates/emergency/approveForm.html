<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应急信息审批 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>应急信息审批</h1>
    <p th:text="${info.title}">标题</p>
  </div>

  <div class="card card-pad" style="max-width:760px;">
    <div class="alert info" style="font-size:14px;">
      <strong>信息内容：</strong><span th:text="${info.content}" style="white-space:pre-wrap;"></span>
      <div style="margin-top:8px;" class="muted">
        有效期：<span th:text="${#temporals.format(info.validFrom,'yyyy-MM-dd')}"></span>~
        <span th:text="${#temporals.format(info.validTo,'yyyy-MM-dd')}"></span>
      </div>
    </div>

    <form th:action="@{'/emergency/' + ${info.id} + '/approve'}" method="post">
      <div class="field">
        <label class="label">审批意见</label>
        <input type="text" name="remark" placeholder="填写审批意见">
      </div>
      <div class="actions">
        <button class="btn" type="submit">审批通过并发布</button>
      </div>
    </form>

    <form th:action="@{'/emergency/' + ${info.id} + '/reject'}" method="post" class="js-confirm" data-confirm="确认驳回该条应急信息吗？">
      <div class="field" style="margin-top:16px;">
        <label class="label">驳回原因</label>
        <input type="text" name="remark" placeholder="填写驳回原因">
      </div>
      <div class="actions">
        <button class="btn danger" type="submit">驳回</button>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
