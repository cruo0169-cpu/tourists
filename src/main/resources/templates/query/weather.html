<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天气预报 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>天气状况</h1>
    <p>查询景区各区域天气状况</p>
  </div>

  <form class="search" th:action="@{/weather}" method="get" style="margin-bottom:18px;">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="输入区域名称">
    <button class="btn" type="submit">查询</button>
  </form>

  <div class="grid grid-2" th:if="${!#lists.isEmpty(items)}">
    <div class="card card-pad" th:each="w : ${items}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <div>
          <h2 style="margin:0 0 4px;font-size:18px;" th:text="${w.area}">区域</h2>
          <div class="muted" th:text="${#temporals.format(w.forecastDate,'yyyy-MM-dd')} + ' 预报'">日期</div>
        </div>
        <span class="badge teal" th:text="${w.weather}">天气</span>
      </div>
      <div class="grid grid-4" style="margin-top:14px;">
        <div class="stat"><span class="num" style="font-size:18px;" th:text="${w.temperature}">温</span><span class="lbl">温度</span></div>
        <div class="stat"><span class="num" style="font-size:18px;" th:text="${w.humidity}">湿</span><span class="lbl">湿度</span></div>
        <div class="stat"><span class="num" style="font-size:18px;" th:text="${w.wind}">风</span><span class="lbl">风力</span></div>
      </div>
      <p style="margin:14px 0 0;color:#374151;" th:text="${w.suggestion}">建议</p>
    </div>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(items)}">没有找到相关天气信息。</div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
