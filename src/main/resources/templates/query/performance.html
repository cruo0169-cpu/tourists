<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>演出团体 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>营业性演出团体</h1>
    <p>查询景区内营业性演出团体信息</p>
  </div>

  <form class="search" th:action="@{/performance}" method="get" style="margin-bottom:18px;">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="输入团体名称或类型">
    <button class="btn" type="submit">查询</button>
  </form>

  <div class="grid grid-3" th:if="${!#lists.isEmpty(items)}">
    <div class="card card-pad" th:each="g : ${items}">
      <div class="tag" th:text="${g.category}">类型</div>
      <h2 style="margin:10px 0 6px;font-size:18px;" th:text="${g.name}">团体</h2>
      <div class="muted" th:text="'地址：' + ${g.address}">地址</div>
      <div class="muted" th:text="'联系：' + ${g.contact}">联系</div>
      <p style="margin:12px 0 0;color:#374151;" th:text="${g.description}">描述</p>
    </div>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(items)}">没有找到相关演出团体。</div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
