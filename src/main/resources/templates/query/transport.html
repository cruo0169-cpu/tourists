<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅游交通 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>旅游交通</h1>
    <p>查询景区内旅游交通车辆信息</p>
  </div>

  <form class="search" th:action="@{/transport}" method="get" style="margin-bottom:18px;">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="输入名称、类型或线路">
    <button class="btn" type="submit">查询</button>
  </form>

  <div class="grid grid-3" th:if="${!#lists.isEmpty(items)}">
    <div class="card card-pad" th:each="t : ${items}">
      <div class="tag" th:text="${t.type}">类型</div>
      <h2 style="margin:10px 0 6px;font-size:18px;" th:text="${t.name}">名称</h2>
      <div class="muted" th:text="'线路：' + ${t.route}">线路</div>
      <div class="muted" th:text="'班次：' + ${t.schedule}">班次</div>
      <div class="muted" th:text="'间隔：' + ${t.frequency}">间隔</div>
      <p style="margin:10px 0;" th:text="'票价：¥' + ${t.price}">票价</p>
      <p style="margin:0;color:#374151;" th:text="${t.description}">描述</p>
    </div>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(items)}">没有找到相关交通信息。</div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
