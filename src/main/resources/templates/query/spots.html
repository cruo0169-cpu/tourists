<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>景区景点 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>旅游景区（点）</h1>
    <p>查询景区内各类旅游景点信息</p>
  </div>

  <form class="search" th:action="@{/spots}" method="get" style="margin-bottom:18px;">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="输入景点名称或分类">
    <button class="btn" type="submit">查询</button>
  </form>

  <div class="grid grid-3" th:if="${!#lists.isEmpty(items)}">
    <div class="card card-pad" th:each="s : ${items}">
      <div class="tag" th:text="${s.category}">分类</div>
      <h2 style="margin:10px 0 6px;font-size:18px;" th:text="${s.name}">景点</h2>
      <div class="muted" th:text="'位置：' + ${s.location}">位置</div>
      <div class="muted" th:text="'开放时间：' + ${s.openTime}">时间</div>
      <p style="margin:10px 0;" th:text="'门票：¥' + ${s.ticketPrice}">门票</p>
      <p style="margin:0;color:#374151;" th:text="${s.description}">描述</p>
    </div>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(items)}">没有找到相关景点。</div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
