<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的入住 · 游客服务系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
  <div class="page-head">
    <h1>我的入住</h1>
    <p>查看入住预订记录</p>
  </div>

  <div class="card" th:if="${!#lists.isEmpty(items)}">
    <table class="table">
      <thead>
        <tr><th>酒店/房型</th><th>入住</th><th>退房</th><th>联系人</th><th>状态</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="b : ${items}">
          <td>
            <span th:text="${b.room.hotel.name}">酒店</span>
            <span class="muted" th:text="' · ' + ${b.room.roomType}">房型</span>
          </td>
          <td class="muted" th:text="${#temporals.format(b.checkIn,'yyyy/MM/dd')}">入住</td>
          <td class="muted" th:text="${#temporals.format(b.checkOut,'yyyy/MM/dd')}">退房</td>
          <td class="muted" th:text="${b.guestName} + ' / ' + ${b.phone}">联系人</td>
          <td>
            <span class="badge" th:classappend="${b.status.name() == 'PENDING'} ? 'amber' : (${b.status.name() == 'CONFIRMED'} ? 'green' : 'gray')"
                  th:text="${b.status.label}">状态</span>
          </td>
          <td>
            <form th:if="${b.status.name() == 'PENDING'}" th:action="@{'/booking/' + ${b.id} + '/cancel'}" method="post"
                  class="js-confirm" data-confirm="确认取消该预订吗？" style="display:inline-block;">
              <button class="btn danger sm">取消</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(items)}">暂无入住预订，可到酒店详情页选择入住。</div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
